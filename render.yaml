services:
  - type: web
    name: gotit-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    # Optional on a verified paid service: preDeployCommand: node scripts/preflight.js
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 90
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: CORE_API_BASE_URL
        value: https://rbase-core-api.onrender.com
      - key: CORE_APPLICATION_KEY
        value: gotit
      - key: CORS_ORIGINS
        sync: false
      - key: TRUST_PROXY_HOPS
        value: '0'
      - key: ENRICHMENT_SIGNING_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_WORKSPACE_ID
        sync: false
      - key: AI_READING_MODEL
        value: claude-sonnet-5
      - key: CLAUDE_STRUCTURED_OUTPUT
        value: 'true'
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TRANSLATION_MODEL
        value: gpt-5.4-nano
      - key: GOOGLE_TRANSLATION_API
        value: cloud_basic_v2
      - key: GOOGLE_TRANSLATE_API_KEY
        sync: false
      - key: SPEECH_PROVIDER
        value: google
      - key: GOOGLE_SPEECH_API_KEY
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_SPEECH_LANGUAGES_JSON
        sync: false
      - key: AZURE_SPEECH_API_KEY
        sync: false
      - key: AZURE_SPEECH_REGION
        sync: false
      - key: AZURE_SPEECH_LANGUAGES_JSON
        sync: false
# Migration administrator credentials belong in a separate one-off migration job.
# Provider credentials remain secret Render values and are never bundled with clients.
