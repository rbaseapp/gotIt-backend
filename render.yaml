services:
  - type: web
    name: gotit-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    # Optional on a verified paid service: preDeployCommand: node scripts/preflight.js
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 90
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: CORE_API_BASE_URL
        value: https://rbase-core-api.onrender.com
      - key: CORE_APPLICATION_KEY
        value: gotit
      - key: ENFORCE_PAID_ENTITLEMENTS
        value: 'true'
      - key: ENFORCE_ADDON_ENTITLEMENTS
        value: 'false'
      - key: CORS_ORIGINS
        sync: false
      - key: TRUST_PROXY_HOPS
        value: '0'
      - key: ENRICHMENT_SIGNING_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_READING_MODEL
        value: gpt-6-luna
      - key: OPENAI_TRANSLATION_MODEL
        value: gpt-5.4-nano
      - key: OPENAI_PRIVATE_LESSON_MODEL
        value: gpt-6-sol
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2.5-flare
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime-2.1
      - key: OPENAI_REALTIME_VOICE
        value: marin
      - key: OPENAI_REALTIME_TRANSCRIPTION_MODEL
        value: gpt-4o-mini-transcribe
      - key: PIXABAY_API_KEY
        sync: false
      - key: GOOGLE_TRANSLATION_API
        value: cloud_basic_v2
      - key: GOOGLE_TRANSLATE_API_KEY
        sync: false
      - key: SPEECH_PROVIDER
        value: google
      - key: GOOGLE_SPEECH_API_KEY
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_SPEECH_LANGUAGES_JSON
        sync: false
      - key: AZURE_SPEECH_API_KEY
        sync: false
      - key: AZURE_SPEECH_REGION
        sync: false
      - key: AZURE_SPEECH_LANGUAGES_JSON
        sync: false
      - key: NOTIFICATION_SMTP_HOST
        sync: false
      - key: NOTIFICATION_SMTP_PORT
        sync: false
      - key: NOTIFICATION_SMTP_USER
        sync: false
      - key: NOTIFICATION_SMTP_PASSWORD
        sync: false
      - key: NOTIFICATION_EMAIL_FROM
        sync: false
      - key: NOTIFICATION_VAPID_SUBJECT
        sync: false
      - key: NOTIFICATION_VAPID_PUBLIC_KEY
        sync: false
      - key: NOTIFICATION_VAPID_PRIVATE_KEY
        sync: false
# Migration administrator credentials belong in a separate one-off migration job.
# Provider credentials remain secret Render values and are never bundled with clients.
