name: Backend validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # The checks that decide whether a change is good. They need nothing outside this repository.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gotit-backend
    steps:
      - uses: actions/checkout@v7
        with:
          path: gotit-backend
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gotit-backend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: docker build -t gotit-backend:ci .

  # Integration tests run against a pinned copy of the private Core repository, so they need a
  # read token (the CORE_PLATFORM_READ_TOKEN secret). Without it the job is skipped instead of
  # turning every run red, which hid real failures. Once the secret exists, remove
  # continue-on-error to make it blocking.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      HAS_CORE_TOKEN: ${{ secrets.CORE_PLATFORM_READ_TOKEN != '' }}
    defaults:
      run:
        working-directory: gotit-backend
    steps:
      - name: Skip when no Core read token is configured
        if: env.HAS_CORE_TOKEN != 'true'
        working-directory: .
        run: echo "::notice::Integration tests skipped - add the CORE_PLATFORM_READ_TOKEN secret to run them."
      - uses: actions/checkout@v7
        if: env.HAS_CORE_TOKEN == 'true'
        with:
          path: gotit-backend
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: env.HAS_CORE_TOKEN == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gotit-backend/package-lock.json
      - run: npm ci
        if: env.HAS_CORE_TOKEN == 'true'
      - name: Require a pinned read-only Core baseline for integration
        if: env.HAS_CORE_TOKEN == 'true'
        env:
          CORE_REPOSITORY: ${{ vars.CORE_PLATFORM_REPOSITORY || 'rbaseapp/rbase-core-platforms' }}
          CORE_REF: ${{ vars.CORE_PLATFORM_REF || 'e947d919136237f32dafa6f1ec3235e6849d5746' }}
        run: |
          test -n "$CORE_REPOSITORY" || { echo 'Configure CORE_PLATFORM_REPOSITORY'; exit 1; }
          [[ "$CORE_REF" =~ ^[a-fA-F0-9]{40}$ ]] || { echo 'Configure CORE_PLATFORM_REF with the reviewed Core commit SHA'; exit 1; }
      - uses: actions/checkout@v7
        if: env.HAS_CORE_TOKEN == 'true'
        with:
          repository: ${{ vars.CORE_PLATFORM_REPOSITORY || 'rbaseapp/rbase-core-platforms' }}
          ref: ${{ vars.CORE_PLATFORM_REF || 'e947d919136237f32dafa6f1ec3235e6849d5746' }}
          token: ${{ secrets.CORE_PLATFORM_READ_TOKEN }}
          path: core-platform
          persist-credentials: false
      - name: Install historical migration tooling without changing Core source
        if: env.HAS_CORE_TOKEN == 'true'
        run: npm ci --ignore-scripts --prefix ../core-platform
      - run: npm run test:integration
        if: env.HAS_CORE_TOKEN == 'true'
